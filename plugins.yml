# TEST ENVIRONMENT (arash77/galaxy-social-main). Names match upstream so real posts can be replayed.
# Mastodon and Bluesky are personal accounts: start every test post with "🧪 galaxy-social test",
# the "Clean up test posts" workflow only removes posts with that marker (and their thread replies).
# Matrix is a bot in a test room: the cleanup removes all its messages in the time window.
plugins:
  - name: mastodon-galaxyproject
    class: mastodon.mastodon_client
    enabled: true
    config:
      base_url: "https://mstdn.science"
      access_token: $MASTODON_ACCESS_TOKEN
      max_content_length: 500

  - name: bluesky-galaxyproject
    class: bluesky.bluesky_client
    enabled: true
    config:
      base_url: "https://bsky.social"
      username: "kadkhodaei.de"
      password: $BLUESKY_PASSWORD
      max_content_length: 300

  - name: matrix-eu-announce
    class: matrix.matrix_client
    enabled: true
    config:
      base_url: "https://matrix.org"
      access_token: $MATRIX_ACCESS_TOKEN
      room_id: "!kcRLgCoQjtTGkliqcG:matrix.org"

  - name: linkedin-galaxyproject
    class: linkedin.linkedin_client
    enabled: false  # needs a test company page: set org_id and the LINKEDIN_ACCESS_TOKEN secret
    config:
      access_token: $LINKEDIN_ACCESS_TOKEN
      org_id: 0
      max_content_length: 3000

  - name: crash-test  # always crashes while posting, to test failure handling
    class: crash.crash_client
    enabled: true
    config: {}

  - name: markdown
    class: markdown.markdown_client
    enabled: true
    config:
      save_path: "markdown_cache"
